<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-light" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Otterly Nerdy 3D Prints</title>
    <link rel="icon" type="image/x-icon" href="/images/avatar.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Playful designs, serious prints.">

    <!-- Keywords -->
    <meta name="keywords" content="Otterly Nerdy, 3D prints, Maryland, gifts, toys">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://otterlynerdy.com">

    <!-- Author Information -->
    <meta name="author" content="Otterly Nerdy 3D Prints">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--soft" src="images/avatar.png" srcset="images/avatar.png" alt="OtterlyNerdy3DPrints">

            <!-- Replace with your name or brand -->
            <h1>
              <div>Otterly Nerdy 3D Prints</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Playful designs, serious prints.</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">
              <h3>Contact Us</h3>
              <!-- Generic Email -->
              <a class="button button-default" href="mailto:otterlynerdy3dprints@gmail.com" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="Email Icon">Email</a>

              <h3>Shop Online</h3>
              <!-- Etsy -->
              <a class="button button-etsy" href="https://www.etsy.com/shop/OtterlyNerdy3DPrints" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/etsy.svg" alt="Etsy Logo">Etsy</a>

              <h3>Social Media</h3>
              <!-- Facebook -->
              <!-- <a class="button button-faceb" href="#" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/facebook.svg" alt="Facebook Logo">Facebook</a> -->

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/otterlynerdy3dprints/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <!-- Pinterest -->
              <!-- <a class="button button-pinterest" href="#" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/pinterest.svg" alt="Pinterest Logo">Pinterest</a> -->

              <!-- TikTok -->
              <!-- <a class="button button-tiktok" href="#" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/tiktok.svg" alt="TikTok Logo">TikTok</a> -->

              <h3>Payment Options</h3>
              <!-- Venmo -->
              <a class="button button-venmo" href="https://www.venmo.com/u/otterlynerdy" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/venmo.svg" alt="Venmo Logo">Venmo</a>

              <!-- CashApp -->
              <a class="button button-cash-app" href="https://cash.app/$otterlynerdy" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/cash-app-dollar.svg" alt="CashApp Logo">CashApp</a>

              <!-- PayPal -->
              <a class="button button-paypal" href="https://www.paypal.com/ncp/payment/EYET2BWS644FU" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/paypal.svg" alt="PayPal Logo">PayPal</a>
      </div>

      <!-- Feel free to add your own footer information -->
      <footer>
        Otterly Nerdy - a small 3d printing business located in Abingdon, MD.
      </footer>

    </div>
  </div>

</body>

</html>
